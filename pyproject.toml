[project]
name = "nexus-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "alembic>=1.15,<2", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4", "langgraph-checkpoint-sqlite>=3,<4", "openai>=2,<3", "claude-agent-sdk>=0.1,<1", "psycopg[binary,pool]>=3.2,<4", "google-genai>=1,<3", "boto3>=1.40,<2", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
